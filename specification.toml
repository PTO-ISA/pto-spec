[specification]
name = "PTO Instruction Set Architecture"
short_name = "PTO ISA"
language = "ASL1"
status = "draft"
normative = true
entry_point = "asl/architecture.asl"
formal_model_issue = "https://github.com/PTO-ISA/pto-spec/issues/4"

[profile]
id = "pto-v0"
implementation = "asl/profiles/pto-v0.asl"
conformance_tests = "tests/asl/profile-tests.asl"
numeric_model = "deterministic-raw-carrier-reference"
memory_model = "identity-translation-with-user-protected-region"
reset_model = "explicit-reference-reset"
privilege_model = "user-supervisor-machine"
time_model = "one-tick-per-decoded-attempt"

[architecture]
profile = "pto-v0"
xlen = 64
scalar_forms = 473
system_register_definitions = 52
trap_numbers = 13
tile_model = "one-level"
tile_registers = 64
pto_operations = 111
hierarchical_calls = false

[memory_order]
id = "PTO-TSO"
model = "asl/concurrency.asl"
comparison_source = "https://github.com/herd/herdtools7/blob/0b6e09066d4186c8a26e02e3bb884bd664d5eb34/herd/libdir/x86tso.cat"
event_bound = 16
agent_bound = 4
mixed_size = "fail-closed"

[maturity]
scalar_state = "implemented"
scalar_semantics = "complete-under-pto-v0-reference-profile"
system_state = "implemented-with-explicit-privilege-time-and-reset"
tile_state = "implemented"
tile_semantics = "decoded-with-explicit-legality-and-pto-v0-reference-profile"
binary_decode = "executable-complete"
instruction_dispatch = "all-473-scalar-forms-and-111-tile-operations-executable"
memory_order = "bounded-executable-pto-tso-candidate-model"
source_reconciliation = "all-473-scalar-forms-and-111-tile-operations-closed-at-pinned-public-source"

[toolchain]
aslref_repository = "https://github.com/herd/herdtools7.git"
aslref_pin_file = ".aslref-version"
