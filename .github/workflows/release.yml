name: Release verification

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed PTO-SPEC commit to verify (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-verification-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Release / candidate preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-digest: ${{ steps.preflight-artifact.outputs.artifact-digest }}
    steps:
      - name: Validate exact PTO input
        shell: bash
        env:
          PTO_COMMIT: ${{ inputs.commit }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          [[ "$PTO_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_COMMIT" = "$PTO_COMMIT"

      - name: Check out exact PTO-SPEC candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Validate PTO release identity and local pins
        shell: bash
        env:
          PTO_COMMIT: ${{ inputs.commit }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PTO_COMMIT"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$PTO_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          ./scripts/check-release-preflight \
            --pto-commit "$PTO_COMMIT" \
            --workflow-commit "$WORKFLOW_COMMIT" \
            --output build/release-preflight/candidate.json \
            --diagnostics build/release-preflight/diagnostics.json

      - name: Upload immutable preflight candidate
        id: preflight-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pto-release-preflight-${{ inputs.commit }}
          path: build/release-preflight/candidate.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pto-release-preflight-diagnostics-${{ inputs.commit }}
          path: build/release-preflight/diagnostics.json
          if-no-files-found: error
          retention-days: 30

  full-validation:
    name: Release / full validation
    needs: release-preflight
    uses: ./.github/workflows/full-validation.yml
    with:
      commit: ${{ inputs.commit }}
      authority: release
    permissions:
      contents: read

  release-evidence:
    name: Release / fail-closed evidence aggregation
    needs: full-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Download exact ASL test plan
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: full-validation-plan-release-${{ inputs.commit }}
          path: build/planned-asl-test-pages

      - name: Download every per-ID result
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: full-validation-results-release-${{ inputs.commit }}-*
          path: build/asl-test-results
          merge-multiple: true

      - name: Aggregate exact set equality and regenerate release evidence
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          ./scripts/run-asl-release-suite \
            --commit "$COMMIT" \
            --aggregate-only \
            --matrix-pages build/planned-asl-test-pages \
            --results build/asl-test-results
          make release-prepare
          git diff --exit-code

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pto-release-evidence-${{ inputs.commit }}
          path: |
            build/asl-test-matrix.json
            build/asl-test-coverage.json
            spec/evidence/asl-test-matrix.sha256
            spec/release-manifest.json
          if-no-files-found: error
          retention-days: 90

  certify-artifacts:
    name: Release / uploaded artifact certification
    needs: [release-preflight, release-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report-sha256: ${{ steps.certify.outputs.report-sha256 }}
      artifact-digest: ${{ steps.certification-artifact.outputs.artifact-digest }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Download exact release evidence artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: pto-release-evidence-${{ inputs.commit }}
          path: build/release-artifacts/release-evidence

      - name: Download exact preflight artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: pto-release-preflight-${{ inputs.commit }}
          path: build/release-artifacts/preflight

      - name: Certify downloaded PTO artifacts offline
        id: certify
        shell: bash
        env:
          PTO_COMMIT: ${{ inputs.commit }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./scripts/check-release-artifacts \
            --pto-root . \
            --release-evidence-root build/release-artifacts/release-evidence \
            --preflight-root build/release-artifacts/preflight \
            --pto-commit "$PTO_COMMIT" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --output build/release-artifact-certification/report.json \
            --diagnostics build/release-artifact-certification/diagnostics.json
          echo "report-sha256=$(sha256sum build/release-artifact-certification/report.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact certification
        id: certification-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pto-release-artifact-certification-${{ inputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-artifact-certification/report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload artifact certification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pto-release-artifact-certification-diagnostics-${{ inputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-artifact-certification/diagnostics.json
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Release / validate
    if: always()
    needs: [release-preflight, full-validation, release-evidence, certify-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every exact-head PTO release gate
        shell: bash
        env:
          RELEASE_PREFLIGHT_RESULT: ${{ needs.release-preflight.result }}
          RELEASE_PREFLIGHT_ARTIFACT_DIGEST: ${{ needs.release-preflight.outputs.artifact-digest }}
          FULL_VALIDATION_RESULT: ${{ needs.full-validation.result }}
          RELEASE_EVIDENCE_RESULT: ${{ needs.release-evidence.result }}
          ARTIFACT_CERTIFICATION_RESULT: ${{ needs.certify-artifacts.result }}
          ARTIFACT_CERTIFICATION_REPORT_SHA256: ${{ needs.certify-artifacts.outputs.report-sha256 }}
          ARTIFACT_CERTIFICATION_ARTIFACT_DIGEST: ${{ needs.certify-artifacts.outputs.artifact-digest }}
        run: |
          test "$RELEASE_PREFLIGHT_RESULT" = success
          [[ "$RELEASE_PREFLIGHT_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$FULL_VALIDATION_RESULT" = success
          test "$RELEASE_EVIDENCE_RESULT" = success
          test "$ARTIFACT_CERTIFICATION_RESULT" = success
          [[ "$ARTIFACT_CERTIFICATION_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_CERTIFICATION_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
