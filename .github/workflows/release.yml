name: Release verification

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed commit to verify (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-verification-${{ inputs.commit }}
  cancel-in-progress: false

env:
  ASL_TEST_PAGE_SIZE: "100"

jobs:
  plan:
    name: exact-head release plan
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.matrix.outputs.pages }}
    steps:
      - name: Validate exact commit input
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Prove exact head and lightweight contract
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          make pr-check

      - name: Export exact ASL test pages
        id: matrix
        shell: bash
        run: |
          mkdir -p build/planned-asl-test-pages
          ./scripts/print-asl-test-matrix \
            --page-size "$ASL_TEST_PAGE_SIZE" --page 0 \
            > build/planned-asl-test-pages/page-0.json
          page_count="$(python3 -c 'import json; print(json.load(open("build/planned-asl-test-pages/page-0.json"))["page_count"])')"
          for ((page = 1; page < page_count; page++)); do
            ./scripts/print-asl-test-matrix \
              --page-size "$ASL_TEST_PAGE_SIZE" --page "$page" \
              > "build/planned-asl-test-pages/page-$page.json"
          done
          pages="$(python3 -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1]))), separators=(",", ":")))' "$page_count")"
          test "$pages" != "[]"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"

      - name: Upload exact ASL test plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: planned-asl-test-pages
          path: build/planned-asl-test-pages
          if-no-files-found: error
          retention-days: 90

  strict-model:
    name: strict normative model
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          submodules: recursive

      - name: Set up pinned OCaml
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3
        with:
          ocaml-compiler: "5.2.1"

      - name: Install pinned ASLRef dependencies
        run: make setup

      - name: Validate toolchain canaries and normative model
        run: make toolchain-check check

  asl-page:
    name: ASL page ${{ matrix.page }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        page: ${{ fromJSON(needs.plan.outputs.pages) }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          submodules: recursive

      - name: Download exact ASL test plan
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: planned-asl-test-pages
          path: build/planned-asl-test-pages

      - name: Set up pinned OCaml
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3
        with:
          ocaml-compiler: "5.2.1"

      - name: Install pinned ASLRef dependencies
        run: make setup

      - name: Verify exact ASL page plan
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
          PAGE: ${{ matrix.page }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          ./scripts/print-asl-test-matrix \
            --page-size "$ASL_TEST_PAGE_SIZE" --page "$PAGE" \
            > build/actual-page.json
          cmp "build/planned-asl-test-pages/page-$PAGE.json" build/actual-page.json

      - name: Execute independent ASL points with machine parallelism
        shell: bash
        run: |
          set +e
          ASL_TEST_JOBS="${PTO_ASL_TEST_JOBS:-$(getconf _NPROCESSORS_ONLN)}"
          ./scripts/run-asl-page --matrix build/actual-page.json -j "$ASL_TEST_JOBS"
          execution_status=$?
          set -e
          printf '%s\n' "$execution_status" > build/asl-page-execution.status

      - name: Report per-mnemonic results and enforce the page
        if: always()
        shell: bash
        run: |
          set +e
          ./scripts/report-asl-page-results --matrix build/actual-page.json --results build/asl-test-results
          report_status=$?
          set -e
          test -f build/asl-page-execution.status
          read -r execution_status < build/asl-page-execution.status
          test "$execution_status" = 0
          test "$report_status" = 0

      - name: Upload per-ID ASL results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asl-test-results-${{ matrix.page }}
          path: build/asl-test-results/*/result.json
          if-no-files-found: error
          retention-days: 90

  release-evidence:
    name: fail-closed release evidence
    needs: [plan, strict-model, asl-page]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          submodules: recursive

      - name: Download exact ASL test plan
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: planned-asl-test-pages
          path: build/planned-asl-test-pages

      - name: Download every per-ID result
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: asl-test-results-*
          path: build/asl-test-results
          merge-multiple: true

      - name: Aggregate exact set equality and regenerate release evidence
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          ./scripts/run-asl-release-suite \
            --commit "$COMMIT" \
            --aggregate-only \
            --matrix-pages build/planned-asl-test-pages \
            --results build/asl-test-results
          make release-prepare
          git diff --exit-code

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pto-release-evidence-${{ inputs.commit }}
          path: |
            build/asl-test-matrix.json
            build/asl-test-coverage.json
            spec/evidence/asl-test-matrix.sha256
            spec/release-manifest.json
          if-no-files-found: error
          retention-days: 90

  validate:
    name: Release / validate
    if: always()
    needs: [plan, strict-model, asl-page, release-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Require every exact-head release gate
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          STRICT_MODEL_RESULT: ${{ needs.strict-model.result }}
          ASL_PAGE_RESULT: ${{ needs.asl-page.result }}
          RELEASE_EVIDENCE_RESULT: ${{ needs.release-evidence.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$STRICT_MODEL_RESULT" = success
          test "$ASL_PAGE_RESULT" = success
          test "$RELEASE_EVIDENCE_RESULT" = success
