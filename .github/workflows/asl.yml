name: ASL

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: asl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report temporary validation suspension
        run: |
          echo "::warning::PTO ASL CI coverage is temporarily disabled."
          echo "No release, repository, ASLRef, or executable coverage checks were run."
