name: ASL

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: asl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails in seconds rather than after an OCaml toolchain build.
      - name: Validate repository invariants
        run: make repo-check

      - name: Set up OCaml and opam
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3
        with:
          ocaml-compiler: "5.2.1"

      - name: Install ASLRef build dependencies
        run: make setup

      - name: Validate normative PTO ASL model
        run: make ci
